name: Atualizar focos de queimadas

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas (UTC), no minuto 17 para fugir do pico
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["config.json", "scripts/**", "docs/data/areas_monitoradas.geojson"]

permissions:
  contents: write

concurrency:
  group: atualizar-focos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar e processar focos
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/atualizar_focos.py

      - name: Salvar dados no repositório
        run: |
          git config user.name  "datahorizo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: focos atualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
